<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de pedidos | INV. Armijhon</title>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html.light body { background: #F7F3EA; color: #171512; }
        html.light .bg-slate-900 { background-color: #FFFFFF; }
        html.light .bg-slate-950 { background-color: #F7F3EA; }
        html.light .border-slate-800, html.light .border-slate-700 { border-color: #DED4C1; }
        html.light .text-slate-100, html.light .text-slate-200 { color: #171512; }
        html.light .text-slate-300, html.light .text-slate-400 { color: #6A6459; }
    </style>
    <script src="assets/js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans">
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <header class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between border-b border-slate-800 pb-6">
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-violet-300">INV. Armijhon</span>
                <h1 class="text-3xl font-black mt-2">Panel de pedidos</h1>
                <p class="text-sm text-slate-400 mt-1">Revisa comprobantes y confirma las ventas.</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="rounded-xl border border-slate-700 px-3 py-2 text-xs font-bold hover:bg-slate-800" aria-label="Cambiar tema"><i class="fa-solid fa-sun"></i></button>
                <button id="logout-button" class="hidden rounded-xl border border-slate-700 px-4 py-2 text-xs font-bold hover:bg-slate-800">Cerrar sesión</button>
            </div>
        </header>

        <section id="login-view" class="max-w-md mx-auto mt-16 rounded-3xl border border-slate-800 bg-slate-900 p-6 shadow-2xl">
            <div class="w-12 h-12 rounded-2xl bg-violet-500/15 text-violet-300 flex items-center justify-center text-xl"><i class="fa-solid fa-lock"></i></div>
            <h2 class="text-xl font-black mt-5">Acceso administrativo</h2>
            <p class="text-xs text-slate-400 mt-2">Usa el usuario creado en Supabase Authentication.</p>
            <form id="login-form" class="space-y-3 mt-6" onsubmit="event.preventDefault();">
                <input id="login-email" type="email" required placeholder="Correo electrónico" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm outline-none focus:border-violet-400">
                <input id="login-password" type="password" required placeholder="Contraseña" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm outline-none focus:border-violet-400">
                <button type="submit" class="w-full rounded-xl bg-violet-500 px-4 py-3 text-sm font-black text-white hover:bg-violet-400">Entrar al panel</button>
                <p id="login-status" class="text-xs text-red-400"></p>
            </form>
        </section>

        <section id="orders-view" class="hidden mt-8">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                <div>
                    <h2 class="text-xl font-black">Pedidos recibidos</h2>
                    <p id="orders-summary" class="text-xs text-slate-400 mt-1"></p>
                </div>
                <button id="refresh-orders" class="rounded-xl border border-slate-700 px-4 py-2 text-xs font-bold hover:bg-slate-800"><i class="fa-solid fa-rotate mr-2"></i>Actualizar</button>
            </div>
            <p id="orders-status" class="text-xs text-slate-400 mb-4"></p>
            <div id="realtime-status" class="mb-4 inline-flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-[10px] font-bold text-emerald-300"><span class="h-2 w-2 rounded-full bg-emerald-400"></span> Actualización en tiempo real activa</div>
            <div id="orders-list" class="grid gap-4"></div>
        </section>
    </main>
    <script src="assets/js/admin.js"></script>
    <script>
        if (!window.supabaseClient && !window.supabase) {
            document.getElementById('login-status').textContent = 'No se pudo cargar Supabase. Revisa tu conexión a internet y recarga la página.';
        }
    </script>
</body>
</html>
